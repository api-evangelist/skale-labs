name: Skale Labs
description: >-
  Skale Labs is the team behind SKALE, an Ethereum-compatible, zero-gas-fee blockchain network
  positioned as "the blockchain for a billion agents" with programmable privacy. SKALE runs
  application-specific L1 SKALE Chains on Base and Ethereum with instant finality and no user gas
  fees, and exposes an Ethereum JSON-RPC API plus first-party SDKs (BITE threshold-encryption, MPP
  machine payments), a SKALE CLI built for AI agents, a hosted documentation MCP server, and
  installable Agent Skills. It supports agentic commerce via the x402 payment protocol and ERC-8004
  onchain identity, and native programmable privacy through threshold encryption (encrypted and
  conditional transactions, confidential tokens).
